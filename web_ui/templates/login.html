<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike AI - Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: #1e293b; padding: 40px; border-radius: 16px; width: 350px; text-align: center; }
        .logo { font-size: 48px; margin-bottom: 15px; }
        h1 { color: #f1f5f9; font-size: 22px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 16px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
        .btn:hover { background: #2563eb; }
        .error { color: #fca5a5; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">🔐</div>
        <h1>Mike AI</h1>
        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="Пароль" required>
            <button class="btn" type="submit">Войти</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
</body>
</html>
