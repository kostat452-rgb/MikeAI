<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike AI — Owner Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 40px; width: 380px; text-align: center; }
        .login-box h1 { font-size: 28px; color: #f59e0b; margin-bottom: 6px; }
        .login-box p { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 12px 16px; background: #0a0f1a; border: 1px solid #374151; border-radius: 10px; color: #e2e8f0; font-size: 15px; margin-bottom: 16px; }
        .login-box input:focus { outline: none; border-color: #f59e0b; }
        .login-box button { width: 100%; padding: 12px; background: #f59e0b; color: #111827; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .login-box button:hover { background: #d97706; }
        .error { color: #fca5a5; font-size: 13px; margin-bottom: 12px; }
        .back-link { display: block; margin-top: 16px; color: #6b7280; font-size: 12px; text-decoration: none; }
        .back-link:hover { color: #9ca3af; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Mike AI</h1>
        <p>Панель владельца</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Пароль владельца" autofocus required>
            <button type="submit">Войти</button>
        </form>
        <a href="/" class="back-link">← На главную</a>
    </div>
</body>
</html>
