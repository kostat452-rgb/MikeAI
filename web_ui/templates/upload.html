<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot_name }} - База знаний</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #e2e8f0; }
        .container { background: #1e293b; border-radius: 16px; padding: 40px; max-width: 650px; width: 90%; border: 1px solid #334155; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #f1f5f9; font-size: 24px; }
        .subtitle { color: #94a3b8; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: #0f172a; border-radius: 10px; padding: 15px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #3b82f6; }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; margin-top: 4px; }
        .upload-area { border: 2px dashed #475569; border-radius: 12px; padding: 30px; text-align: center; margin: 15px 0; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: #3b82f6; }
        .upload-area.dragover { border-color: #3b82f6; background: #1e3a5f; }
        #file-input { display: none; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
        .btn:hover { background: #2563eb; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .btn-clear { background: #7f1d1d; margin-top: 8px; }
        .btn-clear:hover { background: #991b1b; }
        .status { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
        .status.success { display: block; background: #065f46; color: #6ee7b7; }
        .status.error { display: block; background: #7f1d1d; color: #fca5a5; }
        .file-list { margin-top: 12px; }
        .file-item { background: #0f172a; padding: 10px 15px; border-radius: 6px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 14px; }
        .info-text { text-align: center; margin-top: 15px; color: #64748b; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤖</div>
            <h1>{{ bot_name }}</h1>
            <p class="subtitle">База знаний {{ company_name }}</p>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="docs-count">{{ docs_count }}</div><div class="stat-label">Документов</div></div>
            <div class="stat-card"><div class="stat-number" id="users-count">{{ users_count }}</div><div class="stat-label">Пользователей</div></div>
            <div class="stat-card"><div class="stat-number" id="messages-count">{{ messages_count }}</div><div class="stat-label">Сообщений</div></div>
        </div>
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📁</div>
            <p>Перетащите файлы сюда<br>или нажмите для выбора</p>
            <p style="color: #64748b; font-size: 12px; margin-top: 8px;">PDF, DOCX, TXT, MD</p>
        </div>
        <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md" multiple>
        <button class="btn" id="upload-btn" disabled>Загрузить файлы</button>
        <button class="btn btn-clear" id="clear-btn">Очистить базу знаний</button>
        <div class="status" id="status"></div>
        <div class="file-list" id="file-list"></div>
        <div class="info-text">Модель: DeepSeek • RAG: ChromaDB</div>
    </div>
    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const clearBtn = document.getElementById('clear-btn');
        const status = document.getElementById('status');
        const fileList = document.getElementById('file-list');
        let filesToUpload = [];
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        function handleFiles(files) {
            filesToUpload = Array.from(files); fileList.innerHTML = '';
            filesToUpload.forEach(f => { const d = document.createElement('div'); d.className = 'file-item'; d.innerHTML = `<span>📄 ${f.name}</span><span>${(f.size/1024).toFixed(1)} KB</span>`; fileList.appendChild(d); });
            uploadBtn.disabled = filesToUpload.length === 0;
        }
        async function refreshStats() {
            const r = await fetch('/stats'); const d = await r.json();
            document.getElementById('docs-count').textContent = d.docs_in_rag;
        }
        uploadBtn.addEventListener('click', async () => {
            uploadBtn.disabled = true; uploadBtn.textContent = 'Загрузка...';
            for (const file of filesToUpload) {
                const fd = new FormData(); fd.append('file', file);
                try {
                    const r = await fetch('/upload', { method: 'POST', body: fd }); const d = await r.json();
                    status.style.display = 'block';
                    if (d.success) { status.className = 'status success'; status.textContent = `✅ ${d.filename}: ${d.chunks} фрагментов`; }
                    else { status.className = 'status error'; status.textContent = `❌ ${d.error}`; }
                } catch { status.style.display = 'block'; status.className = 'status error'; status.textContent = '❌ Ошибка'; }
            }
            uploadBtn.textContent = 'Загрузить файлы'; uploadBtn.disabled = false; filesToUpload = []; fileList.innerHTML = ''; refreshStats();
        });
        clearBtn.addEventListener('click', async () => {
            if (!confirm('Точно очистить базу знаний?')) return;
            await fetch('/clear'); refreshStats();
            status.style.display = 'block'; status.className = 'status success'; status.textContent = '✅ База очищена';
        });
    </script>
</body>
</html>
